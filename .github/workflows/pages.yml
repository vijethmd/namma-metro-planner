name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          mkdir -p _site
          cp NammaMetroPlanner.html _site/index.html
          cp NammaMetroPlanner.html _site/NammaMetroPlanner.html
          # The key lives in a repo secret, not in git. Without it the app
          # falls back to OpenStreetMap address search.
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then
            printf "window.GOOGLE_MAPS_API_KEY = '%s';\n" "$GOOGLE_MAPS_API_KEY" > _site/config.js
          else
            echo "// No GOOGLE_MAPS_API_KEY secret set; using OpenStreetMap search." > _site/config.js
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
